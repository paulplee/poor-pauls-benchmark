name: Aggregate Results

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours — runs after any publish window has closed
  workflow_dispatch: # manual trigger for maintainers

concurrency:
  group: aggregate-upload # prevent two runs overlapping (second queues, doesn't drop)
  cancel-in-progress: false

jobs:
  aggregate:
    name: Aggregate & upload
    runs-on: ubuntu-latest
    # Only runs on the main repo, not forks (forks lack HF_TOKEN)
    if: github.repository == 'paulplee/poor-pauls-benchmark'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Aggregate and upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python scripts/aggregate_results.py --upload
